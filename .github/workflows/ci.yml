name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The Git Sensor tests spawn a real `git` binary and its own child
    # processes, and v0.1's declared support matrix is macOS-only
    # (ARCHITECTURE.md 0.2) — CI runs on the same platform the tool
    # actually claims to support.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector)
        run: go test -race ./...
